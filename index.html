<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon-kol-ds.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kol-chess</title>
    <!-- Theme boot: stamp ONLY a saved choice pre-paint. Nothing saved → no
         stamp, so the theme CSS's :root:not([data-theme]) system-follow runs
         (law: explicit > system > light — theme ≥0.11.6). Stamping a value
         here would veto the OS. Key/values match @kolkrabbi/kol-framework
         theme.js (THEME_STORAGE_KEY 'kol-theme'). -->
    <script>
      try {
        var t = localStorage.getItem('kol-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) { /* storage blocked — fall through to system-follow */ }
    </script>
    <!-- Umami analytics — uncomment to opt in -->
    <!-- <script defer src="https://analytics.example.com/script.js" data-website-id="YOUR_WEBSITE_ID"></script> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
